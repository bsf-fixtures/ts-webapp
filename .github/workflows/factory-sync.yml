# factory-sync — keeps the repo's settings matching the factory definition.
#
# Runs on merge to the default branch, so a definition change takes effect
# without anyone touching repo settings by hand.
name: factory-sync

on:
  push:
    branches: [main, master]
    paths:
      - '.factory/definition/**'
      - '.github/workflows/factory-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factory-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The runner that judges a change must not come from the change. A pull
      # request, a merge-group commit or an agent's workspace can all modify
      # .factory/bin, so it is taken from the default branch and parked outside the
      # workspace, which is the only directory the agent sandbox can write to.
      - name: Fetch the factory runner from the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .factory-trusted
          sparse-checkout: .factory/bin
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Put the trusted runner on PATH
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/bsf"
          cp -R .factory-trusted/.factory/bin/. "$RUNNER_TEMP/bsf/"
          rm -rf .factory-trusted
          echo "$RUNNER_TEMP/bsf" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bsf/bsf" --version
      - name: Mint a token
        id: token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.FACTORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-administration: write
          permission-actions: write
      # Adds the factory's required checks where the plan allows it, and keeps
      # every protection rule the repo already had. On a plan without branch
      # protection it records that the audit fallback applies instead, rather
      # than failing.
      - name: Sync required checks and protection
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: bsf sync-settings
