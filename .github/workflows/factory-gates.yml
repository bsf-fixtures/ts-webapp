# factory-gates — Gate 1 (static) and Gate 2 (verification).
#
# Runs in its own job with no builder in it, so an agent's own "tests pass"
# never counts. Results are keyed by commit, so a commit is never checked
# twice: opening a PR re-runs nothing, and an approval registers without
# re-running the gates.
name: factory-gates

on:
  # A push to a factory branch is a PR synchronize, which this already gets.
  # A separate push trigger judged the same commit twice, once without its
  # PR, and the two verdicts landed on the same commit.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  merge_group:

permissions:
  contents: read
  checks: write
  pull-requests: read

concurrency:
  group: factory-gates-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      model_verifier: ${{ steps.models.outputs.model_verifier }}
      static: ${{ steps.plan.outputs.static }}
      tests: ${{ steps.plan.outputs.tests }}
      coverage: ${{ steps.plan.outputs.coverage }}
      agent_verification: ${{ steps.plan.outputs.agent_verification }}
      commit: ${{ steps.plan.outputs.commit }}
      work_item: ${{ steps.plan.outputs.work_item }}
      pr_number: ${{ steps.plan.outputs.pr_number }}
      # 'false' only when told not to judge: on the PR that installs the
      # factory, or for a label that changes nothing. An older runner on the
      # default branch that predates this output leaves it empty, and the
      # change is judged — a factory upgrade must not skip its own gates.
      judge: ${{ steps.trusted.outputs.installed == 'false' && 'false' || steps.plan.outputs.judge }}
      host_access: ${{ steps.plan.outputs.host_access }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The runner that judges a change must not come from the change. A pull
      # request, a merge-group commit or an agent's workspace can all modify
      # .factory/bin, so it is taken from the default branch and parked outside the
      # workspace, which is the only directory the agent sandbox can write to.
      - name: Fetch the factory runner from the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .factory-trusted
          sparse-checkout: |
            .factory/bin
            .factory/definition
            .factory/sandbox
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Put the trusted runner on PATH
        id: trusted
        shell: bash
        run: |
          # The PR that installs the factory is the one PR with no judge on
          # the default branch yet. There is nothing trusted to judge it with,
          # so it is not judged: every gate skips and a person reviews it, as
          # they must anyway, since it changes protected paths.
          if [ ! -f .factory-trusted/.factory/bin/bsf ]; then
            echo "installed=false" >> "$GITHUB_OUTPUT"
            msg="Not judged: the default branch has no factory yet. This PR installs it, so there is no trusted runner to judge it with; review it yourself."
            echo "::notice title=factory-gates::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "installed=true" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/bsf"
          cp -R .factory-trusted/.factory/bin/. "$RUNNER_TEMP/bsf/"
          # The definition and the sandbox decide how a change is judged, so
          # bsf reads them from this copy, never from the checkout.
          mkdir -p "$RUNNER_TEMP/bsf-trusted/.factory"
          for d in definition sandbox; do
            if [ -d ".factory-trusted/.factory/$d" ]; then cp -R ".factory-trusted/.factory/$d" "$RUNNER_TEMP/bsf-trusted/.factory/"; fi
          done
          echo "BSF_TRUSTED_ROOT=$RUNNER_TEMP/bsf-trusted" >> "$GITHUB_ENV"
          rm -rf .factory-trusted
          echo "$RUNNER_TEMP/bsf" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bsf/bsf" --version
      - name: Read each role's model from factory.yaml
        id: models
        if: steps.trusted.outputs.installed == 'true'
        run: bsf models
      # Decides which gates to run: a human PR gets the deterministic ones and
      # spends nothing on models unless it carries factory:verify; a commit
      # already checked runs nothing; a queue update re-runs static rules and
      # tests, and agent verification only where main's incoming changes touch
      # the PR's feature folders.
      - name: Plan the gates for this commit
        id: plan
        if: steps.trusted.outputs.installed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bsf gates plan

  static:
    needs: plan
    if: needs.plan.outputs.judge != 'false' && needs.plan.outputs.static == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The runner that judges a change must not come from the change. A pull
      # request, a merge-group commit or an agent's workspace can all modify
      # .factory/bin, so it is taken from the default branch and parked outside the
      # workspace, which is the only directory the agent sandbox can write to.
      - name: Fetch the factory runner from the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .factory-trusted
          sparse-checkout: |
            .factory/bin
            .factory/definition
            .factory/sandbox
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Put the trusted runner on PATH
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/bsf"
          cp -R .factory-trusted/.factory/bin/. "$RUNNER_TEMP/bsf/"
          # The definition and the sandbox decide how a change is judged, so
          # bsf reads them from this copy, never from the checkout.
          mkdir -p "$RUNNER_TEMP/bsf-trusted/.factory"
          for d in definition sandbox; do
            if [ -d ".factory-trusted/.factory/$d" ]; then cp -R ".factory-trusted/.factory/$d" "$RUNNER_TEMP/bsf-trusted/.factory/"; fi
          done
          echo "BSF_TRUSTED_ROOT=$RUNNER_TEMP/bsf-trusted" >> "$GITHUB_ENV"
          rm -rf .factory-trusted
          echo "$RUNNER_TEMP/bsf" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bsf/bsf" --version
      # All static rules, the per-file ratchet across each linter's native
      # baseline and baselines.json, the weakening check and suppression control.
      # The repo's own linters run from its installed dependencies (eslint
      # lives in node_modules), so the static gate runs in the sandbox too.
      # Before this, a TypeScript repo's eslint never ran and the gate was
      # neutral on every PR.
      - name: Start the sandbox
        env:
          FACTORY_SANDBOX_ENV: ${{ secrets.FACTORY_SANDBOX_ENV }}
        run: bsf sandbox start --if-present
      - name: Gate 1 — static rules
        env:
          GH_TOKEN: ${{ github.token }}
        run: bsf gates static --report-check factory/gate-static

  verification:
    needs: plan
    if: needs.plan.outputs.judge != 'false' && needs.plan.outputs.tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The runner that judges a change must not come from the change. A pull
      # request, a merge-group commit or an agent's workspace can all modify
      # .factory/bin, so it is taken from the default branch and parked outside the
      # workspace, which is the only directory the agent sandbox can write to.
      - name: Fetch the factory runner from the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .factory-trusted
          sparse-checkout: |
            .factory/bin
            .factory/definition
            .factory/sandbox
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Put the trusted runner on PATH
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/bsf"
          cp -R .factory-trusted/.factory/bin/. "$RUNNER_TEMP/bsf/"
          # The definition and the sandbox decide how a change is judged, so
          # bsf reads them from this copy, never from the checkout.
          mkdir -p "$RUNNER_TEMP/bsf-trusted/.factory"
          for d in definition sandbox; do
            if [ -d ".factory-trusted/.factory/$d" ]; then cp -R ".factory-trusted/.factory/$d" "$RUNNER_TEMP/bsf-trusted/.factory/"; fi
          done
          echo "BSF_TRUSTED_ROOT=$RUNNER_TEMP/bsf-trusted" >> "$GITHUB_ENV"
          rm -rf .factory-trusted
          echo "$RUNNER_TEMP/bsf" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bsf/bsf" --version
      # The tests run where the app runs: the sandbox's services, its install
      # and its closed environment, from the default branch's manifest.
      - name: Start the sandbox
        env:
          FACTORY_SANDBOX_ENV: ${{ secrets.FACTORY_SANDBOX_ENV }}
        run: bsf sandbox start --if-present
      # Where the repo already has a CI test check that runs on factory
      # branches, this reads its result for the same commit rather than
      # re-running the tests; after wait_minutes with no result, it runs them.
      - name: Gate 2 — tests, or the repo's own test check
        env:
          GH_TOKEN: ${{ github.token }}
        run: bsf gates tests --report-check factory/gate-tests
      - name: Gate 2 — diff and total coverage
        if: needs.plan.outputs.coverage == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bsf gates coverage --report-check factory/gate-coverage

  agent-verification:
    needs: [plan, verification]
    if: needs.plan.outputs.judge != 'false' && needs.plan.outputs.agent_verification == 'true' && needs.plan.outputs.host_access != 'true'
    # What the compiled role's own jobs request. A caller must grant at
    # least this, or GitHub refuses to start the run; derived from the lock
    # file and checked by a test, so a gh-aw upgrade cannot silently break it.
    permissions:
      actions: read
      checks: read
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/factory-role-verifier.lock.yml
    with:
      model: ${{ needs.plan.outputs.model_verifier }}
      work_item: ${{ needs.plan.outputs.work_item }}
      pipeline: product_work
      pr_number: ${{ fromJSON(needs.plan.outputs.pr_number) }}
      commit: ${{ needs.plan.outputs.commit }}
    secrets: inherit

  # The verifier compiled with host access, for a sandbox that needs the
  # runner; see build-host in factory-run.
  agent-verification-host:
    needs: [plan, verification]
    if: needs.plan.outputs.judge != 'false' && needs.plan.outputs.agent_verification == 'true' && needs.plan.outputs.host_access == 'true'
    # What the compiled role's own jobs request. A caller must grant at
    # least this, or GitHub refuses to start the run; derived from the lock
    # file and checked by a test, so a gh-aw upgrade cannot silently break it.
    permissions:
      actions: read
      checks: read
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/factory-role-verifier-host.lock.yml
    with:
      model: ${{ needs.plan.outputs.model_verifier }}
      work_item: ${{ needs.plan.outputs.work_item }}
      pipeline: product_work
      pr_number: ${{ fromJSON(needs.plan.outputs.pr_number) }}
      commit: ${{ needs.plan.outputs.commit }}
    secrets: inherit

  record:
    needs: [plan, static, verification, agent-verification, agent-verification-host]
    # A label that is not the verify label changes nothing about the change,
    # so it neither re-judges it nor records a second verdict on the commit.
    if: always() && needs.plan.outputs.judge != 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      # The runner that judges a change must not come from the change. A pull
      # request, a merge-group commit or an agent's workspace can all modify
      # .factory/bin, so it is taken from the default branch and parked outside the
      # workspace, which is the only directory the agent sandbox can write to.
      - name: Fetch the factory runner from the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .factory-trusted
          sparse-checkout: |
            .factory/bin
            .factory/definition
            .factory/sandbox
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Put the trusted runner on PATH
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/bsf"
          cp -R .factory-trusted/.factory/bin/. "$RUNNER_TEMP/bsf/"
          # The definition and the sandbox decide how a change is judged, so
          # bsf reads them from this copy, never from the checkout.
          mkdir -p "$RUNNER_TEMP/bsf-trusted/.factory"
          for d in definition sandbox; do
            if [ -d ".factory-trusted/.factory/$d" ]; then cp -R ".factory-trusted/.factory/$d" "$RUNNER_TEMP/bsf-trusted/.factory/"; fi
          done
          echo "BSF_TRUSTED_ROOT=$RUNNER_TEMP/bsf-trusted" >> "$GITHUB_ENV"
          rm -rf .factory-trusted
          echo "$RUNNER_TEMP/bsf" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bsf/bsf" --version
      # Reports factory/gates, the one check branch protection requires: the
      # verdict over every gate the plan called for. Always runs, because a
      # required check that only reports on some PRs blocks the rest forever.
      # Each gate's own check run is what keeps a passed gate from re-running.
      - name: Report factory/gates
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.plan.outputs.commit }}
          PLAN_STATIC: ${{ needs.plan.outputs.static }}
          PLAN_VERIFICATION: ${{ needs.plan.outputs.tests == 'true' || needs.plan.outputs.coverage == 'true' }}
          PLAN_AGENT: ${{ needs.plan.outputs.agent_verification }}
          STATIC: ${{ needs.static.result }}
          VERIFICATION: ${{ needs.verification.result }}
          AGENT: ${{ needs.agent-verification.result != 'skipped' && needs.agent-verification.result || needs.agent-verification-host.result }}
        run: >-
          bsf gates record --commit "$COMMIT"
          --plan-static "$PLAN_STATIC" --plan-verification "$PLAN_VERIFICATION" --plan-agent "$PLAN_AGENT"
          --static "$STATIC" --verification "$VERIFICATION" --agent "$AGENT"
      # A verdict reported with the workflow token starts no workflow — GitHub
      # does not raise check_suite for it — so merge would wait for some other
      # event. Starting it here is what moves a passed PR on. Dispatch is the
      # one event the workflow token may start.
      - name: Hand a passed change to merge
        if: success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run factory-merge.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH"
