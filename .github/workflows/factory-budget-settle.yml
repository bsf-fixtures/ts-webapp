# Settle one agent step's budget hold with what gh-aw measured it spent.
#
# Each role holds its ceiling before its agent starts (`bsf budget reserve`,
# in the role workflow) and, after it, uploads what the agent measured as the
# artifact budget-<key>. The caller runs this right after the role, before
# the next role starts: it reads that measure and the role's threat-detection
# usage, and the hold becomes the real charge. A cost that cannot be read is
# charged at the ceiling, never as zero. A hold nobody settles (a cancelled
# run) is charged at its ceiling by the rollup after four hours.
name: factory-budget-settle

on:
  workflow_call:
    inputs:
      key:
        required: true
        type: string
    secrets:
      FACTORY_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch the factory runner from the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            .factory/bin
            .factory/definition
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Put the runner on PATH
        shell: bash
        run: echo "$GITHUB_WORKSPACE/.factory/bin" >> "$GITHUB_PATH"
      - name: Mint a token for the budget record
        id: token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.FACTORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          permission-contents: write
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: Fetch the step's measure
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: budget-${{ inputs.key }}
          path: /tmp/bsf-budget/measure
      - name: Name its threat-detection artifact
        id: detection
        shell: bash
        run: |
          f=/tmp/bsf-budget/measure/measure.json
          if [ -f "$f" ]; then echo "name=$(jq -r '.detection_artifact // ""' "$f")" >> "$GITHUB_OUTPUT"; fi
      - name: Fetch the threat-detection usage
        if: steps.detection.outputs.name != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.detection.outputs.name }}
          path: /tmp/bsf-budget/detection
      - name: Charge the step
        shell: bash
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          KEY: ${{ inputs.key }}
        run: |
          bsf budget settle --key "$KEY" --measured /tmp/bsf-budget/measure/measure.json --detection-dir /tmp/bsf-budget/detection
          bsf budget status
