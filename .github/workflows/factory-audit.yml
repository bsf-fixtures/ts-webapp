# factory-audit — the fallback where branch protection is unavailable.
#
# A private repo on GitHub Free cannot have required checks, so nothing stops
# a merge that skipped the gates. This watches the default branch instead: it
# runs the gates on what actually landed, and if a commit went in without
# passing them it says so loudly, and opens a revert PR where that is turned
# on.
#
# This is detection, not prevention. Setup says so plainly rather than
# implying the factory is enforcing something it cannot.
name: factory-audit

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factory-audit-${{ github.sha }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The runner that judges a change must not come from the change. A pull
      # request, a merge-group commit or an agent's workspace can all modify
      # .factory/bin, so it is taken from the default branch and parked outside the
      # workspace, which is the only directory the agent sandbox can write to.
      - name: Fetch the factory runner from the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .factory-trusted
          sparse-checkout: |
            .factory/bin
            .factory/definition
            .factory/sandbox
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Put the trusted runner on PATH
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/bsf"
          cp -R .factory-trusted/.factory/bin/. "$RUNNER_TEMP/bsf/"
          # The definition and the sandbox decide how a change is judged, so
          # bsf reads them from this copy, never from the checkout.
          mkdir -p "$RUNNER_TEMP/bsf-trusted/.factory"
          for d in definition sandbox; do
            if [ -d ".factory-trusted/.factory/$d" ]; then cp -R ".factory-trusted/.factory/$d" "$RUNNER_TEMP/bsf-trusted/.factory/"; fi
          done
          echo "BSF_TRUSTED_ROOT=$RUNNER_TEMP/bsf-trusted" >> "$GITHUB_ENV"
          rm -rf .factory-trusted
          echo "$RUNNER_TEMP/bsf" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bsf/bsf" --version
      - name: Mint a token
        id: token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.FACTORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-checks: write
          # Scoped to this repository: an App token otherwise reaches every repo
          # the installation covers.
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      # Checks whether this commit's PR passed the gates before it merged. If
      # it did not, that is recorded, an issue is opened, and — only where
      # enforcement.audit_revert_pr is on — a revert PR follows.
      - name: Audit what landed
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          # The App's own login, from the token step, so its approvals and
          # change requests are recognised without a variable to keep in sync.
          FACTORY_APP_LOGINS: ${{ steps.token.outputs.app-slug }}[bot]
        run: bsf audit --commit "${{ github.sha }}"
