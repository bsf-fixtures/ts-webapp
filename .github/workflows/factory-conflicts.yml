# factory-conflicts — resolves a factory PR that main has moved under.
#
# A rebase is a code change, so it goes back through the gates like any other.
# The resolution never merges itself.
name: factory-conflicts

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: factory-conflicts
  cancel-in-progress: false

jobs:
  find:
    runs-on: ubuntu-latest
    outputs:
      work_item: ${{ steps.scan.outputs.work_item }}
      conflicts: ${{ steps.scan.outputs.conflicts }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The runner that judges a change must not come from the change. A pull
      # request, a merge-group commit or an agent's workspace can all modify
      # .factory/bin, so it is taken from the default branch and parked outside the
      # workspace, which is the only directory the agent sandbox can write to.
      - name: Fetch the factory runner from the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .factory-trusted
          sparse-checkout: .factory/bin
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Put the trusted runner on PATH
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/bsf"
          cp -R .factory-trusted/.factory/bin/. "$RUNNER_TEMP/bsf/"
          rm -rf .factory-trusted
          echo "$RUNNER_TEMP/bsf" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bsf/bsf" --version
      - name: Mint a token
        id: token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.FACTORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write
          permission-actions: write
      # Files one conflict work item per conflicting factory PR. A PR that is
      # merely behind main is not a conflict: the merge queue updates those.
      - name: Find factory PRs that now conflict
        id: scan
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        # Files a conflict work item per PR and dispatches factory-run for it.
        # A job here also called factory-run as a reusable workflow, which it
        # is not, so that path could never start.
        run: bsf conflicts scan
