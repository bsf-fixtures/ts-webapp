# factory-conflicts — rebuilds a factory PR that main has moved under.
#
# The builder makes the same change again on the current main, as a new PR
# that replaces the conflicting one. It goes back through the gates like any
# other change. A person's approval carries over when the rebuilt change adds
# the same lines and removes nothing new; otherwise it asks again.
#
# Each conflicting PR gets a grey factory/conflicts check with a "Rebuild on
# main" button, for when a rebuild does not finish. The check is created with
# this workflow's own token: GitHub sends a button click to the app that made
# the check, and only a click sent to GitHub Actions starts a workflow.
name: factory-conflicts

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  check_run:
    types: [requested_action]

permissions:
  contents: read
  pull-requests: read
  checks: write

concurrency:
  group: factory-conflicts
  cancel-in-progress: false

jobs:
  find:
    runs-on: ubuntu-latest
    outputs:
      work_item: ${{ steps.scan.outputs.work_item }}
      conflicts: ${{ steps.scan.outputs.conflicts }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The runner that judges a change must not come from the change. A pull
      # request, a merge-group commit or an agent's workspace can all modify
      # .factory/bin, so it is taken from the default branch and parked outside the
      # workspace, which is the only directory the agent sandbox can write to.
      - name: Fetch the factory runner from the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .factory-trusted
          sparse-checkout: |
            .factory/bin
            .factory/definition
            .factory/sandbox
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Put the trusted runner on PATH
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/bsf"
          cp -R .factory-trusted/.factory/bin/. "$RUNNER_TEMP/bsf/"
          # The definition and the sandbox decide how a change is judged, so
          # bsf reads them from this copy, never from the checkout.
          mkdir -p "$RUNNER_TEMP/bsf-trusted/.factory"
          for d in definition sandbox; do
            if [ -d ".factory-trusted/.factory/$d" ]; then cp -R ".factory-trusted/.factory/$d" "$RUNNER_TEMP/bsf-trusted/.factory/"; fi
          done
          echo "BSF_TRUSTED_ROOT=$RUNNER_TEMP/bsf-trusted" >> "$GITHUB_ENV"
          rm -rf .factory-trusted
          echo "$RUNNER_TEMP/bsf" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bsf/bsf" --version
      - name: Mint a token
        id: token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.FACTORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write
          permission-actions: write
          # Scoped to this repository: an App token otherwise reaches every repo
          # the installation covers.
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      # Files one conflict work item per conflicting factory PR. A PR that is
      # merely behind main is not a conflict: the merge queue updates those.
      - name: Find factory PRs that now conflict
        id: scan
        if: github.event_name != 'check_run'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          CHECKS_TOKEN: ${{ github.token }}
        # Starts a rebuild (factory-run, reason conflict) per conflicting PR and
        # puts the factory/conflicts check, with its button, on it.
        run: bsf conflicts scan
      - name: Rebuild on main, from the check's button
        if: >-
          github.event_name == 'check_run' &&
          github.event.check_run.name == 'factory/conflicts' &&
          github.event.requested_action.identifier == 'rebuild'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR: ${{ github.event.check_run.pull_requests[0].number }}
        run: bsf conflicts button --pr "$PR"
