# Spec role. The pipelines are fixed; this prompt is part of the factory
# definition, so changing it needs a trusted human's approval.
#
# The model is NOT here: it comes from factory.yaml, because the scheduled
# review may change a model per step and that should not rewrite a prompt.
schema: role/1
id: spec
purpose: >-
  Turn a triaged work item into a plan precise enough that the builder has nothing left to decide.
reads_context: [feature-map, runbook, fundamentals, history, practices, policy, guardrails, sandbox]
tools: [read, shell, git, web]
prompt: |
  See .github/workflows/factory-role-spec.md, which holds this role's prompt
  and is what gh-aw compiles. This file records the role's shape for the
  dashboard and for the policy check; the prompt lives with the workflow so
  the two cannot drift apart.
outputs: [plan, acceptance_checks, tests_changed]
sees_builder_transcript: false
