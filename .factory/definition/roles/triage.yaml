# Triage role. The pipelines are fixed; this prompt is part of the factory
# definition, so changing it needs a trusted human's approval.
#
# The model is NOT here: it comes from factory.yaml, because the scheduled
# review may change a model per step and that should not rewrite a prompt.
schema: role/1
id: triage
purpose: >-
  Understand the work item, reproduce a bug in the sandbox, and decide whether it is real, understood and in scope.
reads_context: [feature-map, fundamentals, history, practices, policy, sandbox]
tools: [read, shell, browser]
prompt: |
  See .github/workflows/factory-role-triage.md, which holds this role's prompt
  and is what gh-aw compiles. This file records the role's shape for the
  dashboard and for the policy check; the prompt lives with the workflow so
  the two cannot drift apart.
outputs: [finding, before-screenshots]
sees_builder_transcript: false
